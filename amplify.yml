version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npm ci --cache .npm --prefer-offline --prefix amplify/functions/shared
        - npm ci --cache .npm --prefer-offline --prefix amplify/functions/ocr-handler
        - npm ci --cache .npm --prefer-offline --prefix amplify/functions/liveness-handler
        - npm ci --cache .npm --prefer-offline --prefix amplify/functions/compare-faces-handler
        - npm ci --cache .npm --prefer-offline --prefix amplify/functions/mock-client-api-handler
        - npm ci --cache .npm --prefer-offline --prefix amplify/functions/data-verification-handler
        - npm ci --cache .npm --prefer-offline --prefix amplify/functions/whatsapp-inbound-handler
        - npm ci --cache .npm --prefer-offline --prefix amplify/functions/webhook-handler
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
